<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hunter System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">⚔️ Hunter System</a>
    <button class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="navbar-menu" id="navbarMenu">
      <li><a href="index.html">Home</a></li>
    </ul>
    <div class="navbar-actions">
      <a href="register.html" class="btn btn-primary btn-small">Register</a>
    </div>
  </nav>

  <!-- Auth Container -->
  <div class="auth-container">
    <div class="auth-card">
      <h2>Login to Your Account</h2>
      
      <!-- Login Form -->
      <form id="loginForm">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email" 
            required
          >
          <div class="form-error" id="emailError"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required
          >
          <div class="form-error" id="passwordError"></div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <div class="form-checkbox">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <label for="rememberMe">Remember me</label>
          </div>
          <a href="#" style="color: #a78bfa; font-size: 0.875rem;">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
          Login to Hunter System
        </button>

        <!-- Success Message -->
        <div class="form-success" id="successMessage">Login successful! Redirecting...</div>
      </form>

      <div class="auth-divider"></div>

      <!-- Register Link -->
      <div class="auth-link">
        Don't have an account? <a href="register.html">Create one now</a>
      </div>
    </div>
  </div>

  <!-- Notification Container -->
  <div id="notificationContainer"></div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
