<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Hunter System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">⚔️ Hunter System</a>
    <button class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="navbar-menu" id="navbarMenu">
      <li><a href="index.html">Home</a></li>
    </ul>
    <div class="navbar-actions">
      <a href="login.html" class="btn btn-ghost btn-small">Login</a>
    </div>
  </nav>

  <!-- Auth Container -->
  <div class="auth-container">
    <div class="auth-card">
      <h2>Create Your Hunter Account</h2>
      
      <!-- Registration Form -->
      <form id="registerForm">
        <!-- Username Field -->
        <div class="form-group">
          <label for="username">Hunter Name</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Choose your hunter name" 
            minlength="3"
            maxlength="20"
            required
          >
          <div class="form-error" id="usernameError"></div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input 
            type="email" 
            id="regEmail" 
            name="email" 
            placeholder="Enter your email" 
            required
          >
          <div class="form-error" id="emailError"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input 
            type="password" 
            id="regPassword" 
            name="password" 
            placeholder="Create a strong password" 
            minlength="6"
            required
          >
          <div class="form-error" id="passwordError"></div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            placeholder="Confirm your password" 
            minlength="6"
            required
          >
          <div class="form-error" id="confirmPasswordError"></div>
        </div>

        <!-- Terms Checkbox -->
        <div class="form-checkbox">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
        </div>
        <div class="form-error" id="termsError"></div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
          Create Hunter Account
        </button>

        <!-- Success Message -->
        <div class="form-success" id="successMessage">Registration successful! Redirecting to dashboard...</div>
      </form>

      <div class="auth-divider"></div>

      <!-- Login Link -->
      <div class="auth-link">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <!-- Notification Container -->
  <div id="notificationContainer"></div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
